# Ayu Dark prompt for Starship.
add_newline = false
format = "$directory$git_branch$git_status$line_break$character"

[directory]
format = "[$path]($style) "
style = "bold #59c2ff"
truncation_length = 3

[git_branch]
format = "[$branch]($style)"
style = "bold #d2a6ff"

[git_status]
format = " [$modified$staged$untracked]($style)"
style = "bold #ffb454"
modified = "!"
staged = "+"
untracked = "?"

[character]
success_symbol = "[❯](bold #c2d94c)"
error_symbol = "[❯](bold #ff6666)"
