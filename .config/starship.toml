# Ayu Dark prompt for Starship. Palette: https://github.com/ayu-theme/ayu-colors
add_newline = false
command_timeout = 1_000
palette = "ayu_dark"
format = "$directory$git_branch$git_status$fill$cmd_duration\n$character"

[palettes.ayu_dark]
foreground = "#B3B1AD"
comment = "#626A73"
red = "#F07178"
orange = "#FF8F40"
yellow = "#FFB454"
green = "#AAD94C"
cyan = "#95E6CB"
blue = "#59C2FF"
purple = "#D2A6FF"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[ on $branch]($style)"
style = "bold purple"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "yellow"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
modified = " !${count}"
staged = " +${count}"
untracked = " ?${count}"
deleted = " ✘${count}"

[cmd_duration]
min_time = 500
format = "[ $duration]($style)"
style = "comment"

[fill]
symbol = " "

[status]
disabled = false
format = "[$symbol$status]($style) "
style = "bold red"
symbol = "✘ "
